# Light and dark themes. Viewers switch between them from the ⋮ menu at the
# top right (System / Light / Dark); by default the app follows their
# operating-system preference.
#
# Every colour pair below meets WCAG 2.1 AA contrast. The test suite
# (tests/test_accessibility.py) checks these values, so update both together.

[theme]
baseRadius = "medium"
baseFontSize = 16
showWidgetBorder = true   # visible input borders (non-text contrast, WCAG 1.4.11)
linkUnderline = true      # links are not identified by colour alone (WCAG 1.4.1)

[theme.light]
primaryColor = "#1F5FA8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF3F8"
textColor = "#14212E"
linkColor = "#1F5FA8"
borderColor = "#6B7A89"

[theme.dark]
primaryColor = "#6AAEF0"
backgroundColor = "#0E1621"
secondaryBackgroundColor = "#1A2531"
textColor = "#E6EDF3"
linkColor = "#8CC4F5"
borderColor = "#7D8B99"

[server]
headless = true
